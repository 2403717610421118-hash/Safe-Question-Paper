name: safe_question_paper
description: "SecureExam - Safe Question Paper Generation & Transfer System (Simulation)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Real Cryptography (uses Web Crypto API on web - very fast)
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # State & Navigation
  provider: ^6.1.2
  go_router: ^14.6.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
